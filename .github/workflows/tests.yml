name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le projet et pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[discord]" pytest
        
      - name: Lancer les tests
        run: pytest -q