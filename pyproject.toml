[project]
name = "rpyg"
version = "0.1.0"
description = "Retro Python RPG in the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "textual>=1.0",
    "platformdirs>=4.12.1"
]

[project.optional-dependencies]
discord = ["pypresence>=4.6"]
dev = ["pytest", "textual-dev"]

[project.scripts]
rpyg = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
rpyg = ["**/*.json", "**/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]